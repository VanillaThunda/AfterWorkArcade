<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risiko – Würfel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <h1>🎲 Risiko – Würfel</h1>
    <main>
        <section class="side attacker">
            <h2>Angreifer</h2>
            <div id="attackerDice" class="dice"></div>
            <div id="attackerSum" class="sum">Summe: –</div>
            <div class="buttons">
                <button onclick="roll('attacker', 1)">1 Würfel</button>
                <button onclick="roll('attacker', 2)">2 Würfel</button>
                <button onclick="roll('attacker', 3)">3 Würfel</button>
            </div>
        </section>

        <section class="side defender">
            <h2>Verteidiger</h2>
            <div id="defenderDice" class="dice"></div>
            <div id="defenderSum" class="sum">Summe: –</div>
            <div class="buttons">
                <button onclick="roll('defender', 1)">1 Würfel</button>
                <button onclick="roll('defender', 2)">2 Würfel</button>
                <button onclick="roll('defender', 3)">3 Würfel</button>
            </div>
        </section>
    </main>
    <div id="status">Verbinde mit dem Server …</div>
</div>
<script src="app.js"></script>
</body>
</html>
